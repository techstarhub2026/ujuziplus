name: Heartbeat

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping heartbeat endpoint
        run: |
          curl -sf -X POST "${{ secrets.HEARTBEAT_URL }}/api/cron/heartbeat" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}"
